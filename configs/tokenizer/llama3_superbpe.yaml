# SuperBPE draft tokenizer on top of the Llama-3 vocabulary.
# Learn it once with: python scripts/train/train_superbpe.py --config tokenizer/llama3_superbpe.yaml
defaults: superbpe_common.yaml

name: llama3_superbpe
base_tokenizer: tokenizer/llama3.yaml
output_dir: ${oc.env:CKPT_DIR}/tokenizers/llama3_superbpe
