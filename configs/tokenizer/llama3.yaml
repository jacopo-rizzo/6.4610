# Target tokenizer: the standard BPE vocabulary of Llama-3.1.
# The "standard" draft models use this tokenizer unchanged, so their vocab
# matches the target exactly and plain token-level verification works.
name: llama3
hf_name: meta-llama/Llama-3.1-8B-Instruct
vocab_size: 128256        # 128000 BPE tokens + 256 reserved/special tokens

special_tokens:
  end_of_turn: "<|eot_id|>"        # ends an assistant reply in the chat template
  end_of_text: "<|end_of_text|>"   # separates pretraining documents
  pad: "<|finetune_right_pad_id|>"
