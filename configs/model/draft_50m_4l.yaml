# Shallow, wide ~50M-parameter draft: 4 layers of width 1024.
#
# At batch size 1 a draft step's latency is set mostly by the number of layers, not by
# the parameter count (the 16-layer draft_50m takes ~14 ms per step against ~39 ms for
# the 7B target, a cost ratio of 0.39). This draft keeps about the same non-embedding
# size in a quarter of the layers, to lower the cost ratio.
# Non-embedding params ≈ 48M (the tied embedding is twice as large as draft_50m's).
name: draft_50m_4l
architecture: llama

hidden_size: 1024
num_layers: 4
num_attention_heads: 16
num_key_value_heads: 4
intermediate_size: 3072
max_position_embeddings: 2048
rope_theta: 500000.0
rms_norm_eps: 1.0e-5
tie_word_embeddings: true
