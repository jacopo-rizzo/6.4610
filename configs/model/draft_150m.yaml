# ~150M-parameter Llama-style draft model.
# Non-embedding params ≈ 151.0M (tied embedding adds ~98M at 128k vocab).
# See draft_50m.yaml for why we count non-embedding params.
name: draft_150m
architecture: llama

hidden_size: 768
num_layers: 24
num_attention_heads: 12
num_key_value_heads: 4
intermediate_size: 2048
max_position_embeddings: 2048
rope_theta: 500000.0
rms_norm_eps: 1.0e-5
tie_word_embeddings: true
