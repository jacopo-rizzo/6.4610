# Settings shared by every eval benchmark. Each benchmark config sets
# `defaults: default.yaml` and only overrides what differs.
# The target model (and its tokenizers) come from the profile; for OLMo-2
# add the override target_profile=targets/olmo2.yaml.
target_profile: targets/llama3.yaml
dtype: bfloat16

# Each entry is a distilled draft checkpoint plus the tokenizer it uses.
drafts:
  - name: std_50m
    checkpoint: ${oc.env:CKPT_DIR}/drafts/distill/draft_50m_${target.name}
    tokenizer: ${target.tokenizer}
  - name: superbpe_50m
    checkpoint: ${oc.env:CKPT_DIR}/drafts/distill/draft_50m_${target.name}_superbpe
    tokenizer: ${target.superbpe_tokenizer}
  - name: std_150m
    checkpoint: ${oc.env:CKPT_DIR}/drafts/distill/draft_150m_${target.name}
    tokenizer: ${target.tokenizer}
  - name: superbpe_150m
    checkpoint: ${oc.env:CKPT_DIR}/drafts/distill/draft_150m_${target.name}_superbpe
    tokenizer: ${target.superbpe_tokenizer}

# Plain autoregressive decoding with the target, the speed baseline.
include_autoregressive_baseline: true

speculative:
  # Draft proposal length is fixed in BYTES so the token granularity of the
  # two tokenizers does not confound the comparison. Sweep over these.
  # The draft stops after the token that reaches the limit.
  draft_len_bytes: [16, 32, 64]
  max_draft_steps: 16          # safety cap on draft forward passes per round
  max_target_tokens_per_round: 64
  temperatures: [0.0, 0.7, 1.0]
  top_p: 1.0
  # Decoding method per draft tokenizer (see superspec/decoding/speculative.py):
  #   standard:    Leviathan et al. rejection sampling, shared vocabulary
  #   superword:   ours, rejection sampling with the first-token marginal and
  #                length-aware rows for later superword tokens
  #   superword_pointmass: ablation, later superword tokens vs a point mass
  #   exact_match: Timor et al. string-level exact match (lossless fallback)
  # Keyed by the kind of draft tokenizer, whatever the target.
  methods:
    standard: [standard]
    superbpe: [superword, superword_pointmass]
  # Also run exact_match on every draft, so the verification rule's effect on
  # speed and acceptance can be separated from the tokenizer's.
  also_run_exact_match: true
  # exact_match re-encodes the draft's text with the target tokenizer (as in
  # Timor et al.). false: use superword expansions directly instead, which
  # changes only the verification rule relative to "superword".
  exact_match_retokenize: true

generation:
  max_new_tokens: 1024
  batch_size: 1              # only 1 is supported (standard for latency measurements)

timing:
  warmup_prompts: 2          # generations run before each configuration, not recorded
  # Sync the GPU between draft / target / overhead phases to time each one.
  # The syncs add latency to speculative runs only (the autoregressive
  # baseline has none), so keep this false for reported speedups. Set it true
  # in a separate diagnostic run to get draft_ms_per_step / target_ms_per_pass.
  phase_breakdown: false

save_outputs: true           # store generated text in results.jsonl

# Losslessness check (scripts/eval/lossless.py): compare byte-level output
# distributions of each speculative method against the target alone.
lossless_check:
  num_prompts: 20
  samples_per_prompt: 200
  temperature: 1.0
  max_new_tokens: 8          # only the start of each output is compared
  prefix_bytes: 8            # outcome = first 8 bytes of output
  num_permutations: 2000
  draft_len_bytes: 32
  # Also run a deliberately biased method on SuperBPE drafts; it should fail,
  # which shows the check can detect a bug (see eval/lossless.py).
  include_biased_control: true

# Held-out loss (scripts/eval/heldout.py), in bits per byte.
heldout:
  pretokenized_dir: ${oc.env:CKPT_DIR}/pretokenized
  budget: 4.4GB              # any budget folder works: the val split is the same text
  context_bytes: 8192        # same context in bytes for both tokenizers
  batch_size: 2
  max_windows: null          # null = whole val split (~20 MB of text)

seed: 0
output_dir: ${oc.env:RESULTS_DIR,./results}/${target.name}
