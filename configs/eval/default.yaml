# Settings shared by every eval benchmark. Each benchmark config sets
# `defaults: default.yaml` and only overrides what differs.
target: meta-llama/Llama-3.1-8B-Instruct

# Each entry is a distilled draft checkpoint plus the tokenizer it uses.
drafts:
  - name: std_50m
    checkpoint: ${oc.env:CKPT_DIR}/drafts/distill/draft_50m_llama3
    tokenizer: tokenizer/llama3.yaml
  - name: superbpe_50m
    checkpoint: ${oc.env:CKPT_DIR}/drafts/distill/draft_50m_llama3_superbpe
    tokenizer: tokenizer/llama3_superbpe.yaml
  - name: std_150m
    checkpoint: ${oc.env:CKPT_DIR}/drafts/distill/draft_150m_llama3
    tokenizer: tokenizer/llama3.yaml
  - name: superbpe_150m
    checkpoint: ${oc.env:CKPT_DIR}/drafts/distill/draft_150m_llama3_superbpe
    tokenizer: tokenizer/llama3_superbpe.yaml

# Plain autoregressive decoding with the target, the speed baseline.
include_autoregressive_baseline: true

speculative:
  # Draft proposal length is fixed in BYTES so the token granularity of the
  # two tokenizers does not confound the comparison. Sweep over these.
  # The draft stops after the token that reaches the limit.
  draft_len_bytes: [16, 32, 64]
  max_draft_steps: 16          # safety cap on draft forward passes per round
  max_target_tokens_per_round: 64
  temperatures: [0.0, 0.7, 1.0]
  top_p: 1.0
  # Decoding method per draft tokenizer (see superspec/decoding/speculative.py):
  #   standard:    Leviathan et al. rejection sampling, shared vocabulary
  #   superword:   ours, rejection sampling with the first-token marginal
  #   exact_match: Timor et al. string-level exact match (lossless fallback)
  methods:
    llama3: [standard]
    llama3_superbpe: [superword]
  # Also run exact_match on every draft, so the verification rule's effect on
  # speed and acceptance can be separated from the tokenizer's.
  also_run_exact_match: true

generation:
  max_new_tokens: 1024
  batch_size: 1              # standard for latency measurements
  use_chat_template: true

timing:
  warmup_prompts: 5          # excluded from timing
  cuda_sync: true
  repeats: 1

metrics:
  - bytes_per_second         # primary speed metric (vocab-independent)
  - speedup_vs_autoregressive
  - token_acceptance_rate
  - byte_acceptance_rate
  - mean_accepted_bytes_per_step
  - draft_steps_per_target_step

# Losslessness check: compare byte-level output distributions of spec decoding
# vs the target alone on repeated samples of the same prompts.
lossless_check:
  enabled: false             # turn on for the dedicated correctness runs
  num_prompts: 20
  samples_per_prompt: 200
  temperature: 1.0

seed: 0
output_dir: ${oc.env:RESULTS_DIR,./results}
