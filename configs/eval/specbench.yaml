# Spec-Bench (Xia et al., 2024): 480 prompts over six domains.
# The questions are not on the HF Hub; download them once with:
#   mkdir -p data/spec_bench && curl -L -o data/spec_bench/question.jsonl \
#     https://raw.githubusercontent.com/hemingkx/Spec-Bench/main/data/spec_bench/question.jsonl
defaults: default.yaml
name: specbench

data:
  path: data/spec_bench/question.jsonl
  prompt_field: turns        # list of turns; we use the first turn
  category_field: category
  categories:                # results are also reported per category
    - mt_bench
    - translation
    - summarization
    - qa
    - math_reasoning
    - rag
  # Spec-Bench has 80 prompts per category; a full sweep at 1024 new tokens takes
  # many GPU hours, so start with a subset. null = all.
  max_prompts_per_category: 10
  max_prompts: null
