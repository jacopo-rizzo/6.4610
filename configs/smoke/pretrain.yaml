# Smoke test: ~350 pretraining steps of the real 50M architecture on 50 MB.
#   python scripts/train/pretokenize.py --config smoke/pretrain.yaml --tokenizer standard
#   python scripts/train/pretrain.py --config smoke/pretrain.yaml --tokenizer standard
# and the same with --tokenizer superbpe.
defaults: ../train/pretrain.yaml

# Smoke runs use the small smoke SuperBPE tokenizer as "the SuperBPE tokenizer".
target:
  superbpe_tokenizer: ${target.smoke_superbpe_tokenizer}

model: model/draft_50m.yaml

data:
  train_bytes: 50_000_000      # -> folder name "0.05GB"
  held_out_bytes: 2_000_000
  pretokenized_dir: ${oc.env:CKPT_DIR}/smoke/pretokenized

batch:
  sequences_per_step: 16
  micro_batch_size: 4

logging:
  every_steps: 10
  eval_every_steps: 100
  eval_windows: 20

output_dir: ${oc.env:CKPT_DIR}/smoke/drafts/pretrain
save_every_steps: 100
