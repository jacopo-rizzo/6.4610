# Distillation: fine-tune a pretrained draft on the target's own responses so
# its style and formatting match the target (otherwise acceptance is low).
#
# Step 1 (generate): run the target on UltraChat prompts, save responses.
#   This is shared by all drafts, so it only needs to run once.
# Step 2 (train): fine-tune each pretrained draft on those responses.

generate:
  target: meta-llama/Llama-3.1-8B-Instruct
  prompts:
    hf_name: HuggingFaceH4/ultrachat_200k
    split: train_sft
    num_prompts: 100000
    first_turn_only: true    # keep single-turn prompts for simplicity
  sampling:
    temperature: 0.8
    top_p: 1.0
    max_new_tokens: 1024
  backend: vllm              # pip install -e ".[generate]"; falls back to HF if absent
  output_path: ${oc.env:CKPT_DIR}/distill_data/ultrachat_llama3.jsonl
  seed: 0

train:
  init_from: ${oc.env:CKPT_DIR}/drafts/pretrain   # pretrained draft to start from
  model: model/draft_50m.yaml
  tokenizer: tokenizer/llama3.yaml
  data_path: ${generate.output_path}
  chat_template: llama3      # format prompts exactly as the target sees them
  loss_on: response_only     # mask out prompt tokens
  seq_len: 2048
  epochs: 2
  optim:
    name: adamw
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
    grad_clip: 1.0
    schedule: cosine
    warmup_frac: 0.03
  micro_batch_size: 16
  grad_accum_steps: 4
  precision: bf16
  seed: 0
  output_dir: ${oc.env:CKPT_DIR}/drafts/distill
