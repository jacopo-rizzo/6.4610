# Distillation: fine-tune a pretrained draft on the target's own responses so
# its style and formatting match the target (otherwise acceptance is low).
#
# Step 1 (generate): run the target on UltraChat prompts, save responses.
#   This is shared by all drafts, so it only needs to run once.
# Step 2 (train): fine-tune each pretrained draft on those responses.
# For OLMo-2 add the override target_profile=targets/olmo2.yaml to both steps.
target_profile: targets/llama3.yaml

generate:
  prompts:
    hf_name: HuggingFaceH4/ultrachat_200k
    split: train_sft
    num_prompts: 100000
    first_turn_only: true    # keep single-turn prompts for simplicity
  sampling:
    temperature: 0.8
    top_p: 1.0
    max_new_tokens: 1024
  backend: vllm              # pip install -e ".[generate]"; falls back to HF if absent
  output_path: ${oc.env:CKPT_DIR}/distill_data/ultrachat_${target.name}.jsonl
  seed: 0

train:
  # Usually set per run with --model / --tokenizer {standard,superbpe}.
  model: model/draft_50m.yaml
  tokenizer: ${target.tokenizer}
  # Starts from <init_from>/<model>_<tokenizer>, the pretraining output.
  init_from: ${oc.env:CKPT_DIR}/drafts/pretrain
  data_path: ${generate.output_path}
  val_every: 100             # every 100th prompt is held out (1%)
  max_seq_len: 2048          # tokens; longer responses are cut
  epochs: 2
  # SuperBPE drafts only: tokenize training responses in randomly cut segments, a cut at
  # each target-token boundary with this probability (mean segment = 1 / rate tokens,
  # about one speculative round). Teaches the draft the contexts that rounds start from,
  # which fully merged text never shows (see superspec/training/distill.py). 0 = off.
  superword_cut_rate: 0.1
  # > 0: also train on the target's own next-token distribution, KL(p || q) over the
  # top-k probabilities stored by scripts/train/distill_teacher.py in teacher_dir
  # (see superspec/training/distill.py). 0 = sampled responses only.
  kl_weight: 0.0
  teacher_dir: ${oc.env:CKPT_DIR}/distill_data/teacher_${target.name}
  teacher_top_k: 32
  teacher_max_tokens: 2560   # prompt + response target tokens per row when the teacher runs
  optim:
    name: adamw
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
    grad_clip: 1.0
    schedule: cosine
    warmup_frac: 0.03
    min_lr_frac: 0.1
  # Same examples per step for both tokenizers (they share the examples).
  examples_per_step: 64
  micro_batch_size: 8        # per GPU
  precision: bf16
  seed: 0
  logging:
    every_steps: 20
    eval_every_steps: 200
    wandb: ${oc.env:WANDB_MODE,disabled}
  eval_examples: 1000        # held-out responses per eval (null = all)
  save_every_steps: 500
  # Final models: <output_dir>/<model>_<tokenizer>; the eval configs read these.
  output_dir: ${oc.env:CKPT_DIR}/drafts/distill
