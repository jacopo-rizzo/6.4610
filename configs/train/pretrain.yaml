# Pretraining for the draft models. Run once per (model, tokenizer) pair:
#   model:     model/draft_50m.yaml | model/draft_150m.yaml
#   tokenizer: tokenizer/llama3.yaml | tokenizer/llama3_superbpe.yaml
#
# Fair comparison: both tokenizers must see the SAME text. SuperBPE packs more
# bytes into each token, so the training budget is set in bytes, not tokens.
model: model/draft_50m.yaml
tokenizer: tokenizer/llama3.yaml

data:
  mix:
    - hf_name: HuggingFaceFW/fineweb-edu
      subset: sample-10BT
      split: train
      text_field: text
      weight: 0.9
    - hf_name: open-web-math/open-web-math
      split: train
      text_field: text
      weight: 0.1
  # ~20 tokens/param (Chinchilla) at ~4.4 bytes per Llama-3 token, counted
  # on non-embedding params. Override per model:
  #   draft_50m  -> 4.4e9 bytes  (~1B Llama-3 tokens)
  #   draft_150m -> 13.2e9 bytes (~3B Llama-3 tokens)
  train_bytes: 4_400_000_000
  held_out_bytes: 20_000_000   # for the loss-match check in the proposal
  seed: 0
  # Written by scripts/pretokenize.py, one folder per tokenizer and budget.
  pretokenized_dir: ${oc.env:CKPT_DIR}/pretokenized
  num_workers: 8             # tokenizer processes for pretokenization

# Context per training sequence, in bytes. Each tokenizer's seq_len (tokens) is
# context_bytes / its bytes-per-token, so both drafts see the same amount of
# text per sequence (~2045 Llama-3 tokens; fewer SuperBPE tokens). Capped at
# the model's max_position_embeddings.
context_bytes: 9000
epochs: 1

optim:
  name: adamw
  lr: 6.0e-4                 # use ~3e-4 for draft_150m
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  schedule: cosine
  warmup_frac: 0.01
  min_lr_frac: 0.1

batch:
  # Same number of sequences per step for both tokenizers -> same bytes per step
  # (~2.3 MB, ~0.5M Llama-3 tokens) and about the same number of steps.
  sequences_per_step: 256
  # Per GPU. The large-vocab logits dominate memory: 4 x 2048 x 128k floats is
  # already ~4 GB. Raise on 80 GB cards. Gradient accumulation fills the rest.
  micro_batch_size: 4

precision: bf16
seed: 0

logging:
  every_steps: 20
  eval_every_steps: 500
  eval_windows: 100          # held-out windows per eval during training (~1 MB of text)
  wandb: ${oc.env:WANDB_MODE,disabled}

# Final models: <output_dir>/<model>_<tokenizer>, e.g. draft_50m_llama3_superbpe.
output_dir: ${oc.env:CKPT_DIR}/drafts/pretrain
save_every_steps: 500
